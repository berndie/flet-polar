name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest

  dart:
    name: Dart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/flutter/flet_polar
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # The version Flet 1.0.4 builds with.
          flutter-version: 3.44.8
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos .
      - run: flutter test

  android:
    name: Android APK
    needs: [python, dart]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/flet_polar_example
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # Flutter, the NDK and the Gradle caches need about 10 GB of the 14 GB SSD.
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Limit Gradle memory
        # Flet asks for an 8 GB heap, which is all the RAM of a runner on a private
        # repository. This file takes precedence over the settings of the project.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=4
          kotlin.daemon.jvmargs=-Xmx1500m
          EOF
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: uv run --locked flet build apk --arch arm64-v8a --yes --no-rich-output
      - uses: actions/upload-artifact@v7
        with:
          name: flet-polar-example-apk
          path: examples/flet_polar_example/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    # Manual only: macOS minutes are about ten times the price of Linux ones on
    # private repositories. Expected to fail until the deployment target problem in
    # the README is solved.
    name: iOS archive
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/flet_polar_example
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: uv run --locked flet build ipa --yes --no-rich-output
