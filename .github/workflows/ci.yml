name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest

  dart:
    name: Dart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/flutter/flet_polar
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # The version Flet 1.0.4 builds with.
          flutter-version: 3.44.8
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos .
      - run: flutter test

  android:
    name: Android APK
    needs: [python, dart]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/flet_polar_example
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # Flutter, the NDK and the Gradle caches need about 10 GB of the 14 GB SSD.
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        run: uv run --locked flet build apk --arch arm64-v8a --yes --no-rich-output
      - uses: actions/upload-artifact@v7
        with:
          name: flet-polar-example-apk
          path: examples/flet_polar_example/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS archive
    needs: [python, dart]
    continue-on-error: true # Remove once iOS builds.
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/flet_polar_example
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        run: uv run --locked flet build ipa --yes --no-rich-output
        env:
          # polar needs iOS 14, Flet's template targets 13.0. See AGENTS.md.
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: "14.0"
