name: flet_polar
description: Flet extension wrapping the polar Flutter plugin.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flet: ^1.0.4
  flutter:
    sdk: flutter

  polar: 7.12.0

# Only apply when working on this package directly. Apps must declare the same
# overrides in their pyproject.toml: see "Installation" in the README.
dependency_overrides:
  # Test against the oldest supported version. Apps get theirs from `flet build`.
  flet: 1.0.4
  device_info_plus: ^12.3.0
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
