[project]
name = "flet-polar"
version = "0.1.0"
description = "Flet extension for Polar heart rate sensors and devices, wrapping the polar Flutter plugin."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bernd Accou" }]
keywords = ["flet", "polar", "ble", "heart-rate", "ecg", "h10", "verity-sense"]
dependencies = ["flet>=1.0.4"]

[project.urls]
Homepage = "https://github.com/berndie/flet-polar"
Repository = "https://github.com/berndie/flet-polar"
Issues = "https://github.com/berndie/flet-polar/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.flet_polar" = ["pubspec.yaml", "analysis_options.yaml", "lib/**"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
    # flet's from_dict only understands typing.Optional, not `X | None`, so
    # event and model fields must keep using Optional on every supported Python.
    "UP007",
    "UP045",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["flet_polar"]
